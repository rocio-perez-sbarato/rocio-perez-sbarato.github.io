projects:
  - name: Canasta Básica Total Estudiantil
    description: Scraping de precios (supermercados, servicios, librerias, alquileres y colectivos) para mediciones mensuales de la CBTE.
    link: https://cbteunc.github.io/
    image: images/logo_CBTE.jpg
  - name: Migrantes en la escuela argentina 
    description: Limpieza, análisis y visualización de "Base de Datos por Escuela" del Ministerio de Capital Humano. 1era mención en Socio-Hackathon "Investigar en Sociales 2024".
    link: https://github.com/rocio-perez-sbarato/SocioHackaton/
    image: images/entrega-de-premios-sociohackathon-2.jpg
  - name: Hypersets Library
    description: Biblioteca para modelar conjuntos no bien fundados (hypersets) con programación funcional, usada para representar sistemas reflexivos.
    link: https://github.com/rocio-perez-sbarato/Hypersets-Library
    image: images/portada_hypersets.png
  - name: LLMs for Poets
    description: Notebooks interactivas en Google Colab para que personas sin experiencia técnica hagan fine-tuning y resumen automático de textos con LLMs (Hugging Face, PyTorch), con sus propios datos y sin APIs de terceros.
    link: https://github.com/rocio-perez-sbarato/LLMs-for-poets

