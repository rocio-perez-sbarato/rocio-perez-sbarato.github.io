# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: RPS - Página y blog personal
description: > # this means to ignore newlines until "baseurl:"
  Una carta de presentación y una forma de iniciar conversaciones. Creada con jekyll-theme-hackcss
repository: https://github.com/wemake-services/jekyll-theme-hackcss
baseurl: /jekyll-theme-hackcss  # the subpath of your site, e.g. /blog
url: https://wemake-services.github.io  # the base hostname & protocol for your site

# Build settings
markdown: kramdown

# Sass settings
sass:
  style: compressed

# Theme settings
theme_mode: dark  # choices are: 'dark', 'standard', 'markdown'

